name: Pages

# Deploys only after CI has passed on a push to main, so a flow that fails validation or
# tests never goes live. Publishes index.html, player/ and the files each flow references.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# No rights by default; each job asks only for what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Builds the site with read-only access. It never gets the right to deploy.
  build:
    # A pull request from a fork can have a branch called "main" too, so also require a
    # push to this repository.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # sharp makes the share pictures. The test tools aren't needed, and no
      # dependency gets to run an install script.
      - name: Install
        run: npm ci --omit=dev --ignore-scripts

      # GOOGLE_SITE_VERIFICATION is an optional repository variable (Settings → Secrets and
      # variables → Actions → Variables) holding the Search Console HTML-tag code.
      - name: Build the site
        run: node tools/build-site.mjs _site
        env:
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # Only deploys the artifact the build job uploaded. It runs no project code.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
