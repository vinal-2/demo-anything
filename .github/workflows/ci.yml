name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block raw captures
        run: |
          if [ -n "$(git ls-files capture)" ]; then
            echo "::error::Files under capture/ hold unredacted screenshots and must never be committed:"
            git ls-files capture
            exit 1
          fi

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run validate:all
      - run: npx playwright install --with-deps chromium
      - run: npm test
