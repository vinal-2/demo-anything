name: Scorecard

# OpenSSF Scorecard checks the repository's security practices (pinned actions, branch
# protection, token permissions and more) and publishes a score for the README badge.
# https://github.com/ossf/scorecard
on:
  push:
    branches: [main]
  schedule:
    - cron: '27 6 * * 1'
  branch_protection_rule:

# Scorecard only publishes results from a workflow with no workflow-level write rights.
permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write # upload results to the Security tab
      id-token: write # prove to the Scorecard API that this workflow produced them
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
