name: Scorecard

# OpenSSF Scorecard checks the repository's security practices (pinned actions, branch
# protection, token permissions and more) and publishes a score for the README badge.
# https://github.com/ossf/scorecard
on:
  push:
    branches: [main]
  schedule:
    - cron: '27 6 * * 1'
  branch_protection_rule:

# Scorecard only publishes results from a workflow with no workflow-level write rights.
permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write # upload results to the Security tab
      id-token: write # prove to the Scorecard API that this workflow produced them
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
